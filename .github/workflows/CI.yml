name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      # NOT setting QT_FATAL_WARNINGS=1 yet, though it is the right end state — it would turn
      # binding loops, conflicting anchors, unknown properties and QML JS errors into build
      # failures. Measured on Julia 1.12 / macOS arm64: it currently aborts (signal 6) on a Qt
      # font-alias warning, `missing font family "Sans Serif"`, which is Qt's own font
      # resolution rather than a defect in our QML. Enable it once the QML is split into
      # components with a Theme singleton that sets an explicit font family, and once the known
      # conflicting anchors and the implicitHeight binding loop are fixed. See PRD.md.
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
          - 'pre'
        os: ["ubuntu-latest"]
        arch: ["x64"]
        shell: ["bash"]
        compiler: ["g++"]
        include:
          # A desktop GUI whose likeliest user platform is macOS had zero macOS coverage.
          # The QMacStyle ComboBox segfault fixed in this branch was invisible to a
          # Linux-only matrix, and QT_QPA_PLATFORM=offscreen does not protect against it:
          # the platform plugin and the Qt Quick Controls style are chosen independently.
          - version: '1'
            os: macos-latest
            arch: aarch64
            shell: bash
            compiler: clang++

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          
      - name: Set environment variable PHYSICELL_CPP
        run: echo "PHYSICELL_CPP=${{ matrix.compiler }}" >> $GITHUB_ENV
        
      - uses: julia-actions/cache@v2
      - name: Add BergmanLabRegistry
        run: julia -e 'import Pkg; Pkg.Registry.add("General"); Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/drbergman-lab/BergmanLabRegistry.git"))'

      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          PCMM_NUM_PARALLEL_SIMS: 8
          PCMM_PUBLIC_REPO_AUTH: ${{ secrets.PUBLIC_REPO_AUTH }}
          PHYSICELL_CPP: ${{ matrix.compiler }} # maybe necessary for windows??
          MODEL_MANAGER_STUDIO_TESTING: true
      - name: Process coverage on non-LTS versions
        if: matrix.version != 'lts'
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,assets
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2

      - name: Add BergmanLabRegistry
        run: julia -e 'import Pkg; Pkg.Registry.add("General"); Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/drbergman-lab/BergmanLabRegistry.git"))'
        
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()

      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using ModelManagerStudio
          DocMeta.setdocmeta!(ModelManagerStudio, :DocTestSetup, :(using ModelManagerStudio); recursive=true)
          doctest(ModelManagerStudio)
